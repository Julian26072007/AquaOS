<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1719">
  <meta name="description" content="A little light. A whole new underwater world. Explore aquarium lighting with AquaOS.">
  <title>AquaOS · Your aquarium, in a new light</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="./" aria-label="AquaOS home"><span class="brand-mark" aria-hidden="true">≈</span>Aqua<span>OS</span></a><button id="settings-open" class="settings-button" type="button" aria-label="Open settings" aria-haspopup="dialog"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 3h3l1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-3Z"/><circle cx="12" cy="12" r="3"/></svg></button></header>
    <main>
      <section class="preview-section" aria-label="Aquarium lighting preview">
        <div class="tank"><canvas id="scene" role="img" aria-label="Simulated aquarium lighting"></canvas></div>
        <div class="now"><div><h2 id="preset-name">Sunny</h2><p id="preset-description" class="sr-only">Bright, natural daylight.</p></div><span class="active-label"><i></i> Selected</span></div>
      </section>
      <section class="presets-section" aria-labelledby="presets-heading"><div class="section-heading"><h2 id="presets-heading">Presets</h2></div><div class="preset-grid" id="presets"></div></section>
      <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
      <noscript><p>Please enable JavaScript to explore the lighting presets.</p></noscript>
    </main>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title" aria-describedby="settings-note">
    <div class="dialog-heading"><h2 id="settings-title">Settings</h2><button id="settings-close" class="settings-button" type="button" aria-label="Close settings">✕</button></div>
    <p id="settings-note">Your aquarium, your way. More settings are coming soon.</p>
    <p class="simulation-note">This aquarium is a lighting simulation. No hardware is connected.</p>
  </dialog>
</body>
</html>
